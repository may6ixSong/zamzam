name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  FLUTTER_VERSION: "3.47.7"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  android:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      # 저장소 시크릿 ZAMZAM_KEYSTORE_BASE64 등이 있으면 같은 키로 서명해 덮어 설치가 가능하다.
      - name: Signing key (optional)
        env:
          KEYSTORE_BASE64: ${{ secrets.ZAMZAM_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ZAMZAM_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ZAMZAM_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ZAMZAM_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            {
              echo "ZAMZAM_KEYSTORE_PATH=$RUNNER_TEMP/release.jks"
              echo "ZAMZAM_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
              echo "ZAMZAM_KEY_ALIAS=$KEY_ALIAS"
              echo "ZAMZAM_KEY_PASSWORD=$KEY_PASSWORD"
            } >> "$GITHUB_ENV"
            echo "Signing with repository key"
          else
            echo "No signing secret: using a debug key"
          fi

      - name: Build APK
        run: flutter build apk --release --build-name=1.0.${{ github.run_number }} --build-number=${{ github.run_number }}

      - name: Rename APK
        run: cp build/app/outputs/flutter-apk/app-release.apk ZamZam-1.0.${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: ZamZam-apk
          path: ZamZam-1.0.${{ github.run_number }}.apk

      - name: Publish release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: ZamZam 1.0.${{ github.run_number }}
          make_latest: "true"
          body: |
            휴대폰에서 아래 **Assets** 의 `ZamZam-1.0.${{ github.run_number }}.apk` 를 눌러 내려받고 설치하세요.
            Branch `${{ github.ref_name }}` · commit ${{ github.sha }}
          files: ZamZam-1.0.${{ github.run_number }}.apk

  ios:
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      # 서명 없이 컴파일만 확인한다. 실제 설치는 Mac 의 Xcode 에서.
      - run: flutter build ios --release --no-codesign
