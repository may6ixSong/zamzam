name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  FLUTTER_VERSION: "3.47.7"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  android:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      # 시크릿이 없을 때 쓸 서명 키를 빌드 캐시에 보관해 매번 같은 키로 서명한다.
      # (없으면 빌드마다 새 키가 만들어져 업데이트 때마다 앱을 지우고 다시 설치해야 했다.)
      # 저장소에는 키를 넣지 않는다. 비밀번호는 안드로이드 디버그 키의 공개된 기본값이다.
      - name: Reuse signing key
        uses: actions/cache@v4
        with:
          path: ~/.zamzam-signing
          key: zamzam-signing-v1

      # 저장소 시크릿 ZAMZAM_KEYSTORE_BASE64 등이 있으면 같은 키로 서명해 덮어 설치가 가능하다.
      - name: Signing key (optional)
        env:
          KEYSTORE_BASE64: ${{ secrets.ZAMZAM_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ZAMZAM_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ZAMZAM_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ZAMZAM_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            {
              echo "ZAMZAM_KEYSTORE_PATH=$RUNNER_TEMP/release.jks"
              echo "ZAMZAM_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
              echo "ZAMZAM_KEY_ALIAS=$KEY_ALIAS"
              echo "ZAMZAM_KEY_PASSWORD=$KEY_PASSWORD"
            } >> "$GITHUB_ENV"
            echo "Signing with repository key"
          else
            mkdir -p "$HOME/.zamzam-signing"
            KS="$HOME/.zamzam-signing/debug.keystore"
            if [ ! -f "$KS" ]; then
              keytool -genkeypair -keystore "$KS" -storetype PKCS12 -alias androiddebugkey \
                -storepass android -keypass android -keyalg RSA -keysize 2048 -validity 36500 \
                -dname "CN=Android Debug,O=Android,C=US"
              echo "Created a new cached signing key"
            else
              echo "Reusing the cached signing key"
            fi
            {
              echo "ZAMZAM_KEYSTORE_PATH=$KS"
              echo "ZAMZAM_KEYSTORE_PASSWORD=android"
              echo "ZAMZAM_KEY_ALIAS=androiddebugkey"
              echo "ZAMZAM_KEY_PASSWORD=android"
            } >> "$GITHUB_ENV"
          fi

      - name: Build APK
        # 갤럭시 등 최신 폰은 모두 arm64 라 그것만 넣어 용량을 줄인다.
        # GitHub 다운로드 서버가 불안정할 때(504) 빌드 도구를 못 받아 실패하므로 몇 번 다시 시도한다.
        run: |
          for i in 1 2 3 4 5 6; do
            if flutter build apk --release --target-platform android-arm64 --build-name=1.0.${{ github.run_number }} --build-number=${{ github.run_number }}; then
              exit 0
            fi
            echo "Build attempt $i failed; retrying in 40s"
            sleep 40
          done
          exit 1

      - name: Rename APK
        run: cp build/app/outputs/flutter-apk/app-release.apk ZamZam-1.0.${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: ZamZam-apk
          path: ZamZam-1.0.${{ github.run_number }}.apk

      - name: Publish release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: ZamZam 1.0.${{ github.run_number }}
          make_latest: "true"
          body: |
            휴대폰에서 아래 **Assets** 의 `ZamZam-1.0.${{ github.run_number }}.apk` 를 눌러 내려받고 설치하세요.
            Branch `${{ github.ref_name }}` · commit ${{ github.sha }}
          files: ZamZam-1.0.${{ github.run_number }}.apk

  ios:
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      # 서명 없이 컴파일만 확인한다. 실제 설치는 Mac 의 Xcode 에서.
      - run: flutter build ios --release --no-codesign
